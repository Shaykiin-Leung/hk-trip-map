<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0f0f0f;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column}
/* === HEADER === */
#header{background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:14px 20px;z-index:1000;display:flex;align-items:center;gap:12px;flex-shrink:0}

#play-btn{padding:8px 18px;border-radius:24px;border:1px solid #4ECDC4;background:rgba(78,205,196,.15);color:#4ECDC4;font-size:13px;cursor:pointer;font-weight:600;transition:all .3s;white-space:nowrap}
#play-btn:hover{background:#4ECDC4;color:#000}
#play-btn.active{background:#FF6B6B;border-color:#FF6B6B;color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
/* === TABS === */

.tab{padding:6px 16px;border-radius:20px;font-size:12px;border:1px solid #444;cursor:pointer;background:transparent;color:#aaa;transition:all .2s;white-space:nowrap;flex-shrink:0}

// ====== TRANSPORT SEGMENTS ======
// Each segment: {type, from, to, time, waypoints[]}
// waypoints help the line follow realistic paths

function buildSegments(routePlan) {
  const segs = [];
  for (let i = 0; i < routePlan.length - 1; i++) {
    const cur = routePlan[i];
    const next = routePlan[i + 1];
    if (cur.type === 'transport') {
      segs.push({type: cur.mode, label: cur.label, time: cur.time,
        from: routePlan[i-1].loc ? [routePlan[i-1].loc.lat, routePlan[i-1].loc.lng] : null,
        to: next.loc ? [next.loc.lat, next.loc.lng] : null,
        color: TRANSPORT_COLORS[cur.mode] || '#666',
        waypoints: cur.waypoints || []
      });
    } else if (cur.loc && next && next.loc) {
      // Walking between nearby locations
      const dist = haversine(cur.loc.lat, cur.loc.lng, next.loc.lat, next.loc.lng);
      if (dist > 0.5) {
        // If far apart, add implicit transport
        segs.push({type: 'walk', label: '步行', time: `${Math.round(dist*15)}min`,
          from: [cur.loc.lat, cur.loc.lng], to: [next.loc.lat, next.loc.lng],
          color: '#FF9800', waypoints: []
        });
      }
    }
  }
  return segs;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ====== ROUTE DEFINITIONS ======

// ====== MAP STATE ======
let map, activeLines = [], activeMarkers = [], activeRoute = null;
let animating = false, animationTimer = null, currentStep = 0;
let animMarker = null;

function getLoc(id) { return LOCATIONS.find(l => l.id === id); }

function getLngLat(loc) { return [loc.lng, loc.lat]; }

// ====== GENERATE ROUTE WAVEPOINTS ======
// For realistic paths, add intermediate points

function getRouteWaypoints(fromLoc, toLoc, mode) {
  const pts = [[fromLoc.lat, fromLoc.lng]];
  if (mode === 'ferry') {
    // Straight line across harbor
    pts.push([(fromLoc.lat+toLoc.lat)/2, (fromLoc.lng+toLoc.lng)/2]);
  } else if (mode === 'mtr') {
    // Approximate MTR via station
    pts.push([(fromLoc.lat+toLoc.lat)/2, (fromLoc.lng+toLoc.lng)/2]);
  }
  pts.push([toLoc.lat, toLoc.lng]);
  return pts;
}

// ====== BUILD ROUTE GEOMETRY ======
function buildRouteGeometry(route) {
  const coords = [];
  const segments = [];
  let currentCoords = [];
  
  route.steps.forEach((step, i) => {
    if (step.locId) {
      const loc = getLoc(step.locId);
      if (loc) currentCoords.push([loc.lat, loc.lng]);
    }
    if (step.transport) {
      if (currentCoords.length > 0) {
        segments.push({type:'stop', coords:[...currentCoords]});
      }
      // Transport segment
      const prevLoc = i > 0 && route.steps[i-1].locId ? getLoc(route.steps[i-1].locId) : null;
      const nextLoc = i < route.steps.length-1 && route.steps[i+1].locId ? getLoc(route.steps[i+1].locId) : null;
      if (prevLoc && nextLoc) {
        const midLat = (prevLoc.lat + nextLoc.lat) / 2;
        const midLng = (prevLoc.lng + nextLoc.lng) / 2;
        segments.push({
          type: 'transport',
          mode: step.transport,
          label: step.label,
          time: step.time,
          coords: [[prevLoc.lat, prevLoc.lng], [midLat, midLng], [nextLoc.lat, nextLoc.lng]],
          color: TRANSPORT_COLORS[step.transport] || '#666'
        });
      }
      currentCoords = [];
    } else if (i === route.steps.length - 1 && currentCoords.length > 0) {
      segments.push({type:'stop', coords:[...currentCoords]});
    }
  });
  return segments;
}

// ====== DRAW ROUTE ======
function drawRoute(routeKey) {
  // Clear previous
  clearRoute();
  activeRoute = routeKey;
  
  const route = ROUTES[routeKey];
  if (!route) return;

  // Highlight tab
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.route === routeKey);
  });

  // Build timeline
  buildTimeline(route, routeKey);
  
  // Collect all points for bounds
  const allPts = [];
  
  // Draw stop-to-stop connections as lines
  const stopPts = [];
  route.steps.forEach(step => {
    if (step.locId) {
      const loc = getLoc(step.locId);
      if (loc) {
        stopPts.push([loc.lat, loc.lng]);
        allPts.push([loc.lat, loc.lng]);
      }
    }
  });
  
  // Draw connecting lines with transport colors
  let prevLoc = null;
  route.steps.forEach(step => {
    if (step.locId) {
      const loc = getLoc(step.locId);
      if (loc) {
        if (prevLoc) {
          const dist = haversine(prevLoc.lat, prevLoc.lng, loc.lat, loc.lng);
          const color = dist < 0.5 ? '#FF9800' : '#2196F3'; // walk vs mtr
          const line = L.polyline([[prevLoc.lat, prevLoc.lng], [loc.lat, loc.lng]], {
            color: color, weight: 3, opacity: 0.6, dashArray: '8,6'
          }).addTo(map);
          activeLines.push(line);
        }
        prevLoc = loc;
      }
    }
    if (step.transport) {
      prevLoc = null; // Transport segments create own lines
    }
  });

  // Draw markers
  route.steps.forEach(step => {
    if (step.locId) {
      const loc = getLoc(step.locId);
      if (!loc) return;
      const color = step.transport ? TRANSPORT_COLORS[step.transport] : '#4ECDC4';
      const m = L.circleMarker([loc.lat, loc.lng], {
        radius: 8, color: '#fff', weight: 2,
        fillColor: '#4ECDC4', fillOpacity: 1
      }).addTo(map);
      
      const popupContent = `<div class="popup-title">${loc.note ? '📍' : '📍'} ${loc.name}</div>
        ${loc.time ? `<div class="popup-info">⏱ ${loc.time}</div>` : ''}
        ${loc.note ? `<div class="popup-note">${loc.note}</div>` : ''}
        ${loc.url ? `<a class="popup-link" href="${loc.url}" target="_blank">📕 小红书笔记 →</a>` : ''}`;
      
      m.bindPopup(popupContent, {maxWidth:280});
      activeMarkers.push(m);
    }
  });

  // Fit bounds
  if (allPts.length > 0) {
    const bounds = L.latLngBounds(allPts);
    map.fitBounds(bounds, {padding: [40, 40], maxZoom: 14});
  }
}

// ====== BUILD TIMELINE ======
function buildTimeline(route, routeKey) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  
  route.steps.forEach((step, idx) => {
    if (step.locId) {
      const loc = getLoc(step.locId);
      if (!loc) return;
      const div = document.createElement('div');
      div.className = 'tl-step';
      div.dataset.step = idx;
      div.dataset.locId = loc.id;
      div.innerHTML = `
        <div class="tl-time">${step.time || ''}</div>
        <div class="tl-content">
          <span class="tl-icon">📍</span>
          <span class="tl-name">${loc.name}</span>
          <span class="tl-desc">${loc.note || ''}</span>
        </div>`;
      div.onclick = () => {
        map.setView([loc.lat, loc.lng], 15, {animate: true});
        document.querySelectorAll('.tl-step').forEach(s => s.classList.remove('active'));
        div.classList.add('active');
      };
      tl.appendChild(div);
    }
    if (step.transport) {
      const div = document.createElement('div');
      div.className = `tl-transport ${step.transport}`;
      div.innerHTML = `
        <span>${TRANSPORT_ICONS[step.transport] || '🚆'}</span>
        <span class="bar"></span>
        <span>${step.label || ''}</span>
        <span class="time">${step.time || ''}</span>`;
      tl.appendChild(div);
    }
  });
}

// ====== CLEAR ROUTE ======
function clearRoute() {
  activeLines.forEach(l => map.removeLayer(l));
  activeLines = [];
  activeMarkers.forEach(m => map.removeLayer(m));
  activeMarkers = [];
  if (animMarker) { map.removeLayer(animMarker); animMarker = null; }
  if (animationTimer) { clearTimeout(animationTimer); animationTimer = null; }
  animating = false;
  currentStep = 0;
  document.getElementById('play-btn').textContent = '▶ 播放路线';
  document.getElementById('play-btn').classList.remove('active');
}

// ====== ANIMATION ======
function animateRoute(routeKey) {
  const route = ROUTES[routeKey];
  if (!route) return;

  const steps = route.steps.filter(s => s.locId);
  if (steps.length === 0) return;

  if (animating) {
    animating = false;
    if (animationTimer) { clearTimeout(animationTimer); animationTimer = null; }
    document.getElementById('play-btn').textContent = '▶ 播放路线';
    document.getElementById('play-btn').classList.remove('active');
    return;
  }

  animating = true;
  currentStep = 0;
  document.getElementById('play-btn').textContent = '⏸ 暂停';
  document.getElementById('play-btn').classList.add('active');

  function playStep() {
    if (!animating || currentStep >= steps.length) {
      animating = false;
      document.getElementById('play-btn').textContent = '▶ 播放路线';
      document.getElementById('play-btn').classList.remove('active');
      return;
    }

    const step = steps[currentStep];
    const loc = getLoc(step.locId);
    if (!loc) { currentStep++; playStep(); return; }

    // Highlight timeline step
    document.querySelectorAll('.tl-step').forEach(s => {
      s.classList.remove('active', 'completed');
      if (parseInt(s.dataset.step) < currentStep * 2) s.classList.add('completed');
    });
    const tlSteps = document.querySelectorAll('.tl-step');
    if (tlSteps[currentStep]) tlSteps[currentStep].classList.add('active');

    // Fly to location
    map.flyTo([loc.lat, loc.lng], 15, {duration: 1.2});

    // If not first step, draw animated line from previous
    if (currentStep > 0) {
      const prevStep = steps[currentStep - 1];
      const prevLoc = getLoc(prevStep.locId);
      if (prevLoc) {
        const line = L.polyline([[prevLoc.lat, prevLoc.lng], [loc.lat, loc.lng]], {
          color: '#4ECDC4', weight: 4, opacity: 0.9
        }).addTo(map);
        activeLines.push(line);
        
        const len = line._latlngs.length;
        let progress = 0;
        const animLine = setInterval(() => {
          progress += 0.05;
          if (progress >= 1 || !animating) {
            clearInterval(animLine);
            return;
          }
        }, 50);
      }
    }

    currentStep++;
    animationTimer = setTimeout(playStep, 2500);
  }

  playStep();
}

// ====== INIT ======
function init() {
  map = L.map('map', {
    center: [22.31, 114.175],
    zoom: 12,
    zoomControl: true,
    attributionControl: false
  });
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  // Build tabs
  const tabs = document.getElementById('tabs');
  Object.entries(ROUTES).forEach(([k, r]) => {
    const tb = document.createElement('button');
    tb.className = 'tab';
    tb.textContent = r.name;
    tb.dataset.route = k;
    tb.onclick = () => { clearRoute(); drawRoute(k); };
    tabs.appendChild(tb);
  });

  // Play button
  document.getElementById('play-btn').onclick = () => {
    if (!activeRoute) {
      const firstTab = document.querySelector('.tab');
      if (firstTab) {
        drawRoute(firstTab.dataset.route);
        setTimeout(() => animateRoute(firstTab.dataset.route), 500);
      }
    } else {
      animateRoute(activeRoute);
    }
  };

  // Draw first route
  const firstKey = Object.keys(ROUTES)[0];
  drawRoute(firstKey);
}

init();
</script>
