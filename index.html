const categoryColors={attraction:'#FF6B6B',viewpoint:'#4ECDC4',bar:'#FFD93D',cafe:'#FFD93D',shop_record:'#C44FFF',shop_vintage:'#6BCB77',nature:'#FF9F43',stadium:'#fff'};
const categoryIcons={attraction:'📍',viewpoint:'🏙️',bar:'🍸',cafe:'☕',shop_record:'🎵',shop_vintage:'🧸',nature:'🏝️',stadium:'⚽'};
let map,activeLine;
function init(){map=L.map('map',{center:[22.31,114.175],zoom:12.5,zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);DATA.locations.forEach(loc=>{const c=categoryColors[loc.category]||'#888';L.marker([loc.lat,loc.lng],{icon:L.divIcon({html:'<div style="background:'+c+';width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>',iconSize:[18,18],iconAnchor:[9,9],className:''})}).bindPopup('<b>'+(categoryIcons[loc.category]||'')+' '+loc.name+'</b><br><small>'+(loc.address||'')+'</small><br>'+(loc.transport?'<small>🚇 '+loc.transport+'</small><br>':'')+(loc.time_needed?'<small>⏱ '+loc.time_needed+'</small><br>':'')+'<small>'+(loc.note||'')+'</small>'+(loc.note_url?'<br><a href="'+loc.note_url+'" target="_blank">📕 查看小红书笔记→</a>':''),{maxWidth:300}).addTo(map);});const tabs=document.getElementById('route-tabs');Object.entries(DATA.routes).forEach(([k,r])=>{const tb=document.createElement('button');tb.className='route-tab';tb.textContent=r.name;tb.dataset.route=k;tb.style.borderColor=r.color;tb.onclick=()=>showRoute(k);tabs.appendChild(tb);});showRoute(Object.keys(DATA.routes)[0]);}
function showRoute(key){const r=DATA.routes[key];if(!r)return;document.querySelectorAll('.route-tab').forEach(t=>t.classList.toggle('active',t.dataset.route===key));if(activeLine){map.removeLayer(activeLine);activeLine=null;}const pts=[],stops=[];r.stops.forEach(s=>{if(s.transport){stops.push({type:'transport',text:s.transport});return;}if(!s.id)return;const loc=DATA.locations.find(l=>l.id===s.id);if(!loc)return;pts.push([loc.lat,loc.lng]);stops.push({type:'stop',loc,time:s.time,note:s.note||''});});if(pts.length>1){activeLine=L.polyline(pts,{color:r.color,weight:3,opacity:.7,dashArray:'10,6'}).addTo(map);map.fitBounds(activeLine.getBounds().pad(.15));}else if(pts.length===1)map.setView(pts[0],14);const panel=document.getElementById('route-detail');let h='<div style="font-size:12px;color:#888;margin-bottom:6px">⏱ '+((()=>{const f=stops.find(s=>s.type==='stop'&&s.time),l=[...stops].reverse().find(s=>s.type==='stop'&&s.time);return f&&l?f.time+' → '+l.time:'';})())+'</div>';stops.forEach(s=>{if(s.type==='transport')h+='<div class="transport-row">🚇 '+s.text+'</div>';else{const loc=s.loc,c=categoryColors[loc.category]||'#888',ic=categoryIcons[loc.category]||'';h+='<div class="stop"><span class="stop-time">'+(s.time||'')+'</span><span class="category-dot" style="background:'+c+'"></span><span class="stop-name"><b>'+ic+' '+loc.name+'</b></span>'+(s.note?'<span class="stop-note">— '+s.note+'</span>':'')+'</div>';}});panel.innerHTML=h;}
